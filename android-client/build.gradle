plugins {
    id "com.android.application"
}

android {
    namespace = "com.familylocation.client"
    compileSdk = 35
    buildToolsVersion = "36.0.0"

    defaultConfig {
        applicationId = "com.familylocation.client"
        minSdk = 29
        targetSdk = 35
        versionCode = 148
        versionName = "2.3.4"
    }

    sourceSets {
        main {
            manifest.srcFile("AndroidManifest.xml")
            java.srcDirs("src")
            res.srcDirs("res")
            assets.srcDirs("assets")
        }
        smoke {
            res.srcDirs("res-smoke")
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles("proguard-rules.pro")
        }
        // Private, non-publishable device test variant. It keeps the same
        // release code/R8 path while avoiding any collision with an installed
        // legacy package whose signing key is no longer available.
        smoke {
            initWith(release)
            applicationIdSuffix = ".smoke"
            versionNameSuffix = "-smoke"
            debuggable = false
            minifyEnabled = true
            matchingFallbacks = ["release"]
            signingConfig = signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation(project(":android-common"))
}
