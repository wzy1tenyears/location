# Pure Go v3 backend. Public /api/ traffic goes directly to Go.
# The retired legacy admin web UI should stay disabled; the native admin app
# now covers the full management surface.
#
# Required in the production http/server context. Keep this root-managed
# snippet current from Cloudflare's published IP ranges; it must define every
# set_real_ip_from entry, real_ip_header CF-Connecting-IP, and
# real_ip_recursive on. Restrict direct origin traffic at the firewall too.
include /etc/nginx/snippets/family-location-cloudflare-realip.conf;

upstream family_location_v3_backend {
    server 127.0.0.1:8088;
    keepalive 16;
}

