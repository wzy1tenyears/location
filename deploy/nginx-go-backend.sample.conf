# Optional gray-release proxy for the v3 Go backend.
# Main public traffic goes to v3; unported APIs fall back through a localhost-only
# legacy PHP server on 127.0.0.1:8081.

upstream family_location_v3_backend {
    server 127.0.0.1:8088;
    keepalive 16;
}

