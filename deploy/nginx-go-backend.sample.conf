# Pure Go v3 backend. Public /api/ traffic goes directly to Go.
# The retired legacy admin web UI should stay disabled; the native admin app
# now covers the full management surface.
#
# In production, restrict origin access to Cloudflare and configure the realip
# module with Cloudflare IP ranges before forwarding traffic to Go. Example:
#   set_real_ip_from 173.245.48.0/20;
#   set_real_ip_from 103.21.244.0/22;
#   ...
#   real_ip_header CF-Connecting-IP;
#   real_ip_recursive on;

upstream family_location_v3_backend {
    server 127.0.0.1:8088;
    keepalive 16;
}

