<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>位置地图</title>
  <style>
    html, body, #map { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #eef3f1; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #173b35; }
    #map { position: relative; touch-action: none; }
    .map-state { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; padding: 18px; box-sizing: border-box; text-align: center; color: #5b6f69; font-size: 13px; background: linear-gradient(180deg, rgba(244,249,247,.92), rgba(238,243,241,.76)); }
    .marker { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; padding: 0; border-radius: 50%; border: 2px solid #fff; background: var(--marker-color, #0d5f54); color: #fff; font-size: 14px; font-weight: 900; box-shadow: 0 5px 15px rgba(0,0,0,.26); white-space: nowrap; overflow: hidden; text-align: center; box-sizing: border-box; }
    .marker.gps.latest { box-shadow: 0 0 0 7px rgba(13,95,84,.16), 0 6px 18px rgba(0,0,0,.3); }
    .marker.ip { --marker-color: #d97706; }
    .marker.webrtc { --marker-color: #7c3aed; }
    .marker-label { padding: 4px 7px; border-radius: 8px; background: rgba(255,255,255,.94); color: #173b35; border: 1px solid rgba(13,95,84,.16); box-shadow: 0 4px 12px rgba(0,0,0,.16); font-size: 11px; line-height: 1.35; max-width: 210px; white-space: normal; }
    .amap-info-content { color: #173b35; font-size: 13px; line-height: 1.5; }
  </style>
  <script data-cfasync="false">
    const AMAP_KEY = __AMAP_KEY__;
    const AMAP_SERVICE_PATH = __AMAP_SERVICE_PATH__;
    const serviceHost = new URL(AMAP_SERVICE_PATH || '/_AMapService', window.location.origin).toString().replace(/\/$/, '');
    if (serviceHost) {
      window._AMapSecurityConfig = { serviceHost };
    }

    let map = null;
    let pendingRecords = null;
    let currentMarkers = [];
    let currentPolylines = [];
    let infoWindow = null;
    let fallbackScriptStarted = false;
    const colors = ['#0d5f54', '#1677ff', '#059669', '#dc2626', '#0891b2', '#be185d'];

    function state(message) {
      let node = document.querySelector('.map-state');
      if (!message) {
        if (node) node.remove();
        return;
      }
      if (!node) {
        node = document.createElement('div');
        node.className = 'map-state';
        document.body.appendChild(node);
      }
      node.textContent = message;
    }

    function validCoordinate(lat, lng) {
      return Number.isFinite(lat) && Number.isFinite(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180 && !(Math.abs(lat) < 0.000001 && Math.abs(lng) < 0.000001);
    }

    function firstText() {
      for (const value of arguments) {
        if (value === null || value === undefined) continue;
        const text = String(value).trim();
        if (text) return text;
      }
      return '';
    }

    function nameOf(record) {
      const displayName = firstText(record && record.display_name);
      const username = firstText(record && record.username);
      return firstText(displayName, username, '成员');
    }

    function initialOf(text) {
      const name = firstText(text, '成');
      return Array.from(name)[0] || '成';
    }

    function outOfChina(lng, lat) {
      return lng < 72.004 || lng > 137.8347 || lat < 0.8293 || lat > 55.8271;
    }

    function transformLat(x, y) {
      let ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
      ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
      ret += (20.0 * Math.sin(y * Math.PI) + 40.0 * Math.sin(y / 3.0 * Math.PI)) * 2.0 / 3.0;
      ret += (160.0 * Math.sin(y / 12.0 * Math.PI) + 320 * Math.sin(y * Math.PI / 30.0)) * 2.0 / 3.0;
      return ret;
    }

    function transformLng(x, y) {
      let ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
      ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
      ret += (20.0 * Math.sin(x * Math.PI) + 40.0 * Math.sin(x / 3.0 * Math.PI)) * 2.0 / 3.0;
      ret += (150.0 * Math.sin(x / 12.0 * Math.PI) + 300.0 * Math.sin(x / 30.0 * Math.PI)) * 2.0 / 3.0;
      return ret;
    }

    function wgs84ToGcj02(lng, lat) {
      if (outOfChina(lng, lat)) return { lng, lat };
      const a = 6378245.0;
      const ee = 0.00669342162296594323;
      let dLat = transformLat(lng - 105.0, lat - 35.0);
      let dLng = transformLng(lng - 105.0, lat - 35.0);
      const radLat = lat / 180.0 * Math.PI;
      let magic = Math.sin(radLat);
      magic = 1 - ee * magic * magic;
      const sqrtMagic = Math.sqrt(magic);
      dLat = (dLat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * Math.PI);
      dLng = (dLng * 180.0) / (a / sqrtMagic * Math.cos(radLat) * Math.PI);
      return { lat: lat + dLat, lng: lng + dLng };
    }

    function bd09ToGcj02(lng, lat) {
      const x = lng - 0.0065;
      const y = lat - 0.006;
      const z = Math.sqrt(x * x + y * y) - 0.00002 * Math.sin(y * Math.PI * 3000.0 / 180.0);
      const theta = Math.atan2(y, x) - 0.000003 * Math.cos(x * Math.PI * 3000.0 / 180.0);
      return {
        lng: z * Math.cos(theta),
        lat: z * Math.sin(theta),
      };
    }

    function normalizedCoordinateSystem(value) {
      const text = firstText(value).toLowerCase().replace(/[^a-z0-9]/g, '');
      if (text === 'bd09' || text === 'baidu') return 'bd09';
      if (text === 'gcj02' || text === 'gcj' || text === 'amap' || text === 'gaode') return 'gcj02';
      if (text === 'wgs84' || text === 'gps') return 'wgs84';
      return '';
    }

    function coordinateSystemFor(record, diagnostics) {
      const meta = record && record.location_meta && typeof record.location_meta === 'object' ? record.location_meta : {};
      const source = firstGpsSource(diagnostics);
      const system = normalizedCoordinateSystem(
        firstText(
          meta.coordinate_system,
          source && source.coordinate_system
        )
      );
      if (system) return system;
      return 'wgs84';
    }

    function firstGpsSource(diagnostics) {
      const sources = diagnostics && Array.isArray(diagnostics.sources) ? diagnostics.sources : [];
      for (const source of sources) {
        if (source && source.type === 'gps') return source;
      }
      return null;
    }

    function mapCoordinateFor(record, lng, lat, diagnostics) {
      const system = coordinateSystemFor(record, diagnostics);
      if (system === 'bd09') return bd09ToGcj02(lng, lat);
      if (system === 'gcj02') return { lng, lat };
      return wgs84ToGcj02(lng, lat);
    }

    function mapCoordinateForDiagnosticSource(source, lng, lat) {
      const system = normalizedCoordinateSystem(source && source.coordinate_system) || 'wgs84';
      if (system === 'bd09') return bd09ToGcj02(lng, lat);
      if (system === 'gcj02') return { lng, lat };
      return wgs84ToGcj02(lng, lat);
    }

    function sourceLabel(type) {
      if (type === 'ip') return 'IP';
      if (type === 'webrtc') return 'WebRTC';
      return '定位';
    }

    function sourceClass(type) {
      return type === 'ip' || type === 'webrtc' ? type : 'gps';
    }

    function makeMarkerContent(type, latest, text, title) {
      const node = document.createElement('div');
      node.className = `marker ${sourceClass(type)}${latest ? ' latest' : ''}`;
      node.textContent = text;
      node.title = firstText(title, text);
      node.setAttribute('aria-label', firstText(title, text));
      return node;
    }

    function markerInfo(item) {
      const lines = [];
      lines.push(`${item.name} · ${sourceLabel(item.type)}`);
      if (item.address) lines.push(item.address);
      if (item.city || item.region || item.country) lines.push([item.country, item.region, item.city].filter(Boolean).join(' '));
      if (item.provider) lines.push(`来源：${item.provider}`);
      if (item.ip) lines.push(`IP：${item.ip}`);
      const firstReportedAt = firstText(item.firstReportedAt, item.time);
      const lastReportedAt = firstText(item.lastReportedAt, item.time, firstReportedAt);
      if (firstReportedAt || lastReportedAt) {
        const reportCount = Math.max(1, Math.floor(Number(item.reportCount) || 1));
        lines.push(`停留时间：${firstText(firstReportedAt, lastReportedAt)} 至 ${firstText(lastReportedAt, firstReportedAt)}（${formatStayDuration(item.stayDurationSeconds)}，${reportCount}次上报）`);
      }
      const content = document.createElement('div');
      lines.forEach((line) => {
        const row = document.createElement('div');
        row.textContent = line;
        content.appendChild(row);
      });
      return content;
    }

    function formatStayDuration(value) {
      let remaining = Math.max(0, Math.round(Number(value) || 0));
      const days = Math.floor(remaining / 86400);
      remaining %= 86400;
      const hours = Math.floor(remaining / 3600);
      remaining %= 3600;
      const minutes = Math.floor(remaining / 60);
      const seconds = remaining % 60;
      const parts = [];
      if (days) parts.push(`${days}天`);
      if (hours) parts.push(`${hours}小时`);
      if (minutes) parts.push(`${minutes}分钟`);
      if (seconds || !parts.length) parts.push(`${seconds}秒`);
      return parts.join('');
    }

    function normalizeRecord(record, index) {
      if (!record || typeof record !== 'object') return null;
      const lat = Number(record.latitude);
      const lng = Number(record.longitude);
      if (!validCoordinate(lat, lng)) return null;
      const diagnostics = record.address_diagnostics || {};
      const mapCoordinate = mapCoordinateFor(record, lng, lat, diagnostics);
      const name = nameOf(record);
      const gpsSource = firstGpsSource(diagnostics);
      const firstReportedAt = firstText(record.first_reported_at, record.created_at, record.updated_at);
      const lastReportedAt = firstText(record.last_reported_at, record.updated_at, record.created_at, firstReportedAt);
      return {
        type: 'gps',
        name,
        label: initialOf(name),
        lat: mapCoordinate.lat,
        lng: mapCoordinate.lng,
        rawLat: lat,
        rawLng: lng,
        address: firstText(diagnostics.preferred_address, record.address, record.location_address),
        city: firstText(diagnostics.preferred_city, record.city, gpsSource && gpsSource.city),
        region: firstText(record.region),
        country: firstText(record.country),
        provider: 'GPS',
        time: lastReportedAt,
        firstReportedAt,
        lastReportedAt,
        stayDurationSeconds: Math.max(0, Number(record.stay_duration_seconds) || 0),
        reportCount: Math.max(1, Math.floor(Number(record.report_count) || 1)),
        accuracy: Number(record.accuracy),
        userKey: firstText(record.user_id, record.username, String(index)),
        sourceIndex: 0,
      };
    }

    function diagnosticSourceAddress(source) {
      const ip = firstText(source && source.ip, source && source.server_ip, source && source.ipv4, source && source.ipv6);
      const parts = [];
      const appendPart = (value) => {
        const text = firstText(value);
        if (!text || text === ip || parts.some((part) => part.includes(text))) return;
        for (let index = parts.length - 1; index >= 0; index -= 1) {
          if (text.includes(parts[index])) parts.splice(index, 1);
        }
        parts.push(text);
      };
      [
        source && source.country,
        source && source.region,
        source && source.city,
        source && source.district,
        source && source.street,
        source && source.address,
        source && source.detail,
        source && source.poi,
      ].forEach(appendPart);
      const address = parts.join(' ');
      const postalCode = firstText(source && source.postal_code);
      return address && postalCode && !address.includes(postalCode) ? `${address} ${postalCode}` : address;
    }

    function diagnosticAddressPrecision(source) {
      const fields = [
        ['country', 1],
        ['region', 2],
        ['city', 4],
        ['postal_code', 8],
        ['district', 16],
        ['address', 32],
        ['street', 64],
        ['detail', 128],
        ['poi', 128],
      ];
      const ip = firstText(source && source.ip, source && source.server_ip, source && source.ipv4, source && source.ipv6);
      let score = 0;
      let populated = 0;
      fields.forEach(([field, weight]) => {
        const value = firstText(source && source[field]);
        if (!value || (field === 'address' && value === ip)) return;
        score += weight;
        populated += 1;
      });
      return {
        score,
        populated,
        addressLength: diagnosticSourceAddress(source).length,
      };
    }

    function hasDiagnosticCoordinate(source) {
      if (!source || typeof source !== 'object') return false;
      if (source.latitude === null || source.latitude === undefined || source.longitude === null || source.longitude === undefined) return false;
      return validCoordinate(Number(source.latitude), Number(source.longitude));
    }

    function meaningfulDiagnosticValue(value) {
      if (value === null || value === undefined) return false;
      return typeof value !== 'string' || value.trim() !== '';
    }

    function diagnosticSourceIdentity(source) {
      return firstText(source && source.ip, source && source.server_ip, source && source.ipv4, source && source.ipv6).toLowerCase();
    }

    function diagnosticIdentitiesCompatible(parent, nested) {
      const parentIdentity = diagnosticSourceIdentity(parent);
      const nestedIdentity = diagnosticSourceIdentity(nested);
      if (parentIdentity && nestedIdentity) return parentIdentity === nestedIdentity;
      if (!parentIdentity && nestedIdentity) return false;
      return true;
    }

    function sameDiagnosticCoordinate(left, right) {
      return hasDiagnosticCoordinate(left)
        && hasDiagnosticCoordinate(right)
        && Number(left.latitude) === Number(right.latitude)
        && Number(left.longitude) === Number(right.longitude);
    }

    function inheritDiagnosticSource(parent, nested, type) {
      const effective = {};
      const coordinateFields = new Set(['latitude', 'longitude', 'coordinate_system', 'accuracy']);
      const candidate = nested && typeof nested === 'object' ? nested : parent;
      const inheritParent = candidate !== parent && diagnosticIdentitiesCompatible(parent, candidate);
      const copyFields = (source) => {
        if (!source || typeof source !== 'object') return;
        Object.keys(source).forEach((key) => {
          if (key === 'type' || key === 'variants' || key === 'candidates' || coordinateFields.has(key)) return;
          if (meaningfulDiagnosticValue(source[key])) effective[key] = source[key];
        });
      };
      if (inheritParent) copyFields(parent);
      copyFields(candidate);

      const coordinateSource = hasDiagnosticCoordinate(candidate)
        ? candidate
        : (inheritParent && hasDiagnosticCoordinate(parent) ? parent : null);
      if (coordinateSource) {
        effective.latitude = Number(coordinateSource.latitude);
        effective.longitude = Number(coordinateSource.longitude);
        const mayUseParentSystem = coordinateSource === parent || (inheritParent && sameDiagnosticCoordinate(parent, coordinateSource));
        const coordinateSystem = firstText(
          coordinateSource.coordinate_system,
          mayUseParentSystem && parent && parent.coordinate_system
        );
        if (coordinateSystem) {
          effective.coordinate_system = coordinateSystem;
        }
        if (meaningfulDiagnosticValue(coordinateSource.accuracy)) {
          effective.accuracy = coordinateSource.accuracy;
        }
      }
      effective.type = type;
      return effective;
    }

    function betterDiagnosticRank(candidate, selected) {
      if (!selected) return true;
      if (candidate.address.score !== selected.address.score) return candidate.address.score > selected.address.score;
      if (candidate.address.populated !== selected.address.populated) return candidate.address.populated > selected.address.populated;
      if (candidate.ownCoordinate !== selected.ownCoordinate) return candidate.ownCoordinate;
      if (candidate.accuracy !== selected.accuracy) return candidate.accuracy < selected.accuracy;
      return candidate.address.addressLength > selected.address.addressLength;
    }

    function bestDiagnosticSource(source, type) {
      const candidates = [source];
      const nestedField = type === 'ip' ? 'variants' : 'candidates';
      const nested = source && Array.isArray(source[nestedField]) ? source[nestedField] : [];
      nested.forEach((candidate) => {
        if (candidate && typeof candidate === 'object') candidates.push(candidate);
      });

      let selected = null;
      let selectedRank = null;
      candidates.forEach((candidate) => {
        const effective = inheritDiagnosticSource(source, candidate, type);
        if (!hasDiagnosticCoordinate(effective)) return;
        const accuracy = Number(effective.accuracy);
        const rank = {
          address: diagnosticAddressPrecision(effective),
          ownCoordinate: hasDiagnosticCoordinate(candidate),
          accuracy: Number.isFinite(accuracy) && accuracy >= 0 ? accuracy : Number.POSITIVE_INFINITY,
        };
        if (betterDiagnosticRank(rank, selectedRank)) {
          selected = effective;
          selectedRank = rank;
        }
      });
      return selected;
    }

    function normalizeDiagnosticSource(record, source, sourceIndex, recordIndex) {
      if (!source || typeof source !== 'object') return null;
      const type = firstText(source.type).toLowerCase();
      if (type !== 'ip' && type !== 'webrtc') return null;
      const selected = bestDiagnosticSource(source, type);
      if (!selected) return null;
      const lat = Number(selected.latitude);
      const lng = Number(selected.longitude);
      const mapCoordinate = mapCoordinateForDiagnosticSource(selected, lng, lat);
      const name = nameOf(record);
      const firstReportedAt = firstText(record && record.first_reported_at, record && record.created_at, record && record.updated_at);
      const lastReportedAt = firstText(record && record.last_reported_at, record && record.updated_at, record && record.created_at, firstReportedAt);
      return {
        type,
        name,
        label: type === 'ip' ? 'IP' : 'W',
        lat: mapCoordinate.lat,
        lng: mapCoordinate.lng,
        rawLat: lat,
        rawLng: lng,
        address: diagnosticSourceAddress(selected),
        city: firstText(selected.city),
        region: firstText(selected.region),
        country: firstText(selected.country),
        provider: firstText(selected.provider, selected.name, selected.source, sourceLabel(type)),
        ip: firstText(selected.ip, selected.server_ip, selected.ipv4, selected.ipv6),
        time: lastReportedAt,
        firstReportedAt,
        lastReportedAt,
        stayDurationSeconds: Math.max(0, Number(record && record.stay_duration_seconds) || 0),
        reportCount: Math.max(1, Math.floor(Number(record && record.report_count) || 1)),
        accuracy: Number(selected.accuracy),
        userKey: firstText(record && record.user_id, record && record.username, String(recordIndex)),
        sourceIndex: sourceIndex + 1,
      };
    }

    function stableMarkerKey(item) {
      const rawLat = Number.isFinite(Number(item.rawLat)) ? Number(item.rawLat) : Number(item.lat);
      const rawLng = Number.isFinite(Number(item.rawLng)) ? Number(item.rawLng) : Number(item.lng);
      const diagnosticIdentity = item.type === 'gps' ? '' : firstText(item.ip, item.address, item.provider).toLowerCase();
      return [item.type, item.userKey, item.time, rawLat.toFixed(6), rawLng.toFixed(6), diagnosticIdentity].join('|');
    }

    function expandRecords(records) {
      const items = [];
      const seen = new Set();
      (Array.isArray(records) ? records : []).forEach((record, index) => {
        const gps = normalizeRecord(record, index);
        if (gps) items.push(gps);
        const diagnostics = record && record.address_diagnostics && typeof record.address_diagnostics === 'object'
          ? record.address_diagnostics
          : {};
        const sources = Array.isArray(diagnostics.sources) ? diagnostics.sources : [];
        sources.forEach((source, sourceIndex) => {
          const diagnostic = normalizeDiagnosticSource(record, source, sourceIndex, index);
          if (diagnostic) items.push(diagnostic);
        });
      });
      return items.filter((item) => {
        const key = stableMarkerKey(item);
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    function clearMap() {
      currentMarkers.forEach((marker) => marker.setMap(null));
      currentPolylines.forEach((line) => line.setMap(null));
      currentMarkers = [];
      currentPolylines = [];
      if (infoWindow) {
        infoWindow.close();
      }
    }

    function renderRecords(records) {
      pendingRecords = records;
      if (!map || !window.AMap) return;
      clearMap();
      const items = expandRecords(records);
      if (!items.length) {
        state('暂无可显示的位置');
        return;
      }
      state('');
      infoWindow = infoWindow || new AMap.InfoWindow({ offset: new AMap.Pixel(0, -18), isCustom: false });
      const gpsByUser = new Map();
      items.forEach((item) => {
        if (item.type !== 'gps') return;
        if (!gpsByUser.has(item.userKey)) gpsByUser.set(item.userKey, []);
        gpsByUser.get(item.userKey).push(item);
      });
      Array.from(gpsByUser.values()).forEach((group, groupIndex) => {
        group.sort((left, right) => String(left.time).localeCompare(String(right.time)));
        const path = group.map((item) => [item.lng, item.lat]);
        if (path.length > 1) {
          const line = new AMap.Polyline({
            path,
            strokeColor: colors[groupIndex % colors.length],
            strokeOpacity: 0.82,
            strokeWeight: 5,
            strokeStyle: 'solid',
            lineJoin: 'round',
            lineCap: 'round',
          });
          line.setMap(map);
          currentPolylines.push(line);
        }
      });
      items.forEach((item) => {
        const group = gpsByUser.get(item.userKey) || [];
        const latest = item.type === 'gps' && group[group.length - 1] === item;
        const marker = new AMap.Marker({
          position: [item.lng, item.lat],
          content: makeMarkerContent(item.type, latest, item.label, item.name),
          offset: new AMap.Pixel(-18, -18),
          zIndex: item.type === 'gps' ? (latest ? 120 : 100) : 150,
        });
        marker.on('click', () => {
          infoWindow.setContent(markerInfo(item));
          infoWindow.open(map, marker.getPosition());
        });
        marker.setMap(map);
        currentMarkers.push(marker);
      });
      if (currentMarkers.length === 1) {
        map.setZoomAndCenter(16, currentMarkers[0].getPosition());
      } else {
        map.setFitView(currentMarkers, false, [34, 28, 34, 28], 17);
      }
      window.setTimeout(() => {
        if (window.LocMapCapture && typeof window.LocMapCapture.ready === 'function') {
          window.LocMapCapture.ready();
        }
      }, 900);
    }

    function initMap() {
      if (!window.AMap) {
        loadMapScript('1.4.15', false);
        return;
      }
      map = new AMap.Map('map', {
        zoom: 15,
        resizeEnable: true,
        viewMode: '2D',
        jogEnable: true,
        dragEnable: true,
        zoomEnable: true,
        doubleClickZoom: true,
      });
      map.on('complete', () => renderRecords(pendingRecords || []));
      if (pendingRecords) {
        renderRecords(pendingRecords);
      }
    }

    function loadMapScript(version, allowFallback) {
      if (!allowFallback) {
        if (fallbackScriptStarted) return;
        fallbackScriptStarted = true;
        state('正在加载兼容地图组件…');
      }
      const script = document.createElement('script');
      script.src = `${serviceHost}/maps?v=${encodeURIComponent(version)}&key=${encodeURIComponent(AMAP_KEY)}`;
      script.async = true;
      script.onerror = () => {
        if (allowFallback) {
          loadMapScript('1.4.15', false);
        } else {
          state('高德地图脚本加载失败，请检查网络或更新系统 WebView');
        }
      };
      script.onload = () => {
        if (window.AMap) {
          initMap();
        } else if (allowFallback) {
          loadMapScript('1.4.15', false);
        } else {
          state('当前系统 WebView 无法运行地图组件，请更新系统 WebView');
        }
      };
      document.head.appendChild(script);
    }

    window.renderLocHistoryMap = function(records) {
      renderRecords(Array.isArray(records) ? records : []);
    };

    window.addEventListener('DOMContentLoaded', () => {
      state('正在加载高德地图…');
      if (!AMAP_KEY) {
        state('地图密钥未配置');
        return;
      }
      loadMapScript('2.0', true);
    });
  </script>
</head>
<body><div id="map"></div></body>
</html>
